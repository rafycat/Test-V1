    - "35.14Z"  # Commerce d'électricité
    - "27.20Z"  # Piles et accumulateurs
    - "28.25Z"  # Équipements aérauliques et frigorifiques
    - "35.30Z"  # Vapeur et air conditionné
    - "43.22B"  # Installation thermique et climatisation
