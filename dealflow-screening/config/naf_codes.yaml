# Codes NAF cibles par sous-secteur EFI III
# Dérivé de THESIS.md — toute modification de périmètre sectoriel doit être
# répercutée ici ET dans THESIS.md pour rester cohérent.
#
# `keywords` sert de second filtre (sur l'objet social / activité déclarée)
# pour éviter le bruit des codes NAF trop larges.

