    - "27.12Z"  # Matériel de distribution et de commande électrique
    - "20.11Z"  # Chimie de base (hydrogène)
    - "24.46Z"  # Élaboration de matières nucléaires
    - "20.13B"  # Autres produits chimiques inorganiques de base (nucléaire adjacents)
